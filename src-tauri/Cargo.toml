[package]
name = "novomc"
version = "0.3.1"
description = "NovoMC - a Minecraft Java Edition launcher"
authors = ["NovoMC"]
edition = "2021"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows.
name = "novomc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
dirs = "6"
md-5 = "0.10"
sha1 = "0.10"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "json"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
futures-util = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
trash = "5"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
discord-rich-presence = "0.2"
getrandom = "0.2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
