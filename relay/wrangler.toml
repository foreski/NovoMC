# NovoMC bug-report relay. Deploy with:
#   npx wrangler deploy
#   npx wrangler secret put GITHUB_TOKEN
name = "novomc-bug-relay"
main = "src/worker.js"
compatibility_date = "2024-09-23"

[vars]
GITHUB_REPO = "foreski/NovoMC"

# Optional, for rate limits shared across Cloudflare locations:
#   npx wrangler kv namespace create RATE
# then uncomment with the id it prints.
# [[kv_namespaces]]
# binding = "RATE"
# id = "..."
