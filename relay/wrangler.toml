# NovoMC bug-report relay. Deploy with:
#   npx wrangler deploy
#   npx wrangler secret put GITHUB_TOKEN
#   npx wrangler secret put NEWS_TOKEN   (lets the Discord bot post launcher news)
name = "shrill-block-91e1"
main = "src/worker.js"
compatibility_date = "2024-09-23"

[vars]
GITHUB_REPO = "foreski/NovoMC"
DISCORD_CLIENT_ID = "1564439345874739270"

# Optional, for rate limits shared across Cloudflare locations:
#   npx wrangler kv namespace create RATE
# then uncomment with the id it prints.
# [[kv_namespaces]]
# binding = "RATE"
# id = "..."

# Who's on NovoMC (the in-game badge): one Durable Object holding presence in memory.
[[durable_objects.bindings]]
name = "PRESENCE"
class_name = "Presence"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Presence"]

# Launcher news (news.js), posted by the Discord bot.
[[kv_namespaces]]
binding = "NEWS"
id = "aa4d09f390fa4f338294021dee086bb8"

# Novo Client accounts and Marketplace.
#   npx wrangler d1 create novo-accounts   (done; its id is below)
#   npx wrangler d1 execute novo-accounts --remote --file schema.sql
#   npx wrangler secret put DISCORD_CLIENT_SECRET
#   npx wrangler secret put STRIPE_SECRET_KEY
#   npx wrangler secret put STRIPE_WEBHOOK_SECRET
#   npx wrangler secret put SHOP_TOKEN      (lets the Discord bot edit shop items)
# Apply relay/migrations/0002-marketplace.sql and 0003-shop-items.sql before deploying.
# Stripe webhook endpoint: https://<this worker>/stripe/webhook
# Subscribe to checkout.session.completed. Checkout stays disabled until both
# Stripe secrets are configured.
# The Discord application also needs the redirect
#   https://<this worker>/account/discord/callback
[[d1_databases]]
binding = "NOVO_DB"
database_name = "novo-accounts"
database_id = "fc333929-eed8-46ae-bcf7-6c3a61982493"
